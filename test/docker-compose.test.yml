# E2E harness (PLAN section 12): the production app container plus a Playwright
# container, so browser dependencies never enter the production image.
#
#   docker compose -f docker-compose.test.yml up --build \
#     --abort-on-container-exit --exit-code-from playwright
#
# The database lives on a tmpfs, so every run starts from the seeded state that
# 01-fresh-start.spec.ts asserts. Nothing persists between runs by design.

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: ${APP_IMAGE:-artifinancial:test}
    environment:
      LLM_MOCK: "true"
      # Empty means the built-in simulator, which is what the suite is timed for.
      MASSIVE_API_KEY: ""
      GROQ_API_KEY: "unused-in-mock-mode"
    tmpfs:
      - /app/db
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD-SHELL
        - "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')\""
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s

  playwright:
    image: mcr.microsoft.com/playwright:v1.62.1-noble
    depends_on:
      app:
        condition: service_healthy
    environment:
      BASE_URL: http://app:8000
      CI: "true"
    working_dir: /e2e
    volumes:
      - .:/e2e
      - node_modules:/e2e/node_modules
    command: sh -c "npm install --no-audit --no-fund && npx playwright test"

volumes:
  node_modules:
